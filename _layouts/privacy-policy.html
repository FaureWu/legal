<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="description" content="{{ page.title | escape }}">
<title>{{ page.title | escape }}</title>
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="zh-CN" href="{{ '/ruaoc/privacy-policy/' | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ '/ruaoc/en/privacy-policy/' | absolute_url }}">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background: #fff; overflow-wrap: break-word; }
h1 { color: #1a1a1a; border-bottom: 2px solid #eee; padding-bottom: 10px; }
h2 { color: #2c3e50; margin-top: 30px; }
ul { padding-left: 20px; }
li { margin-bottom: 5px; }
a { color: #3498db; }
hr { border: none; border-top: 1px solid #eee; margin: 30px 0; }
em { color: #666; }
</style>
</head>
<body>
<nav aria-label="{% if page.lang == 'en' %}Language{% else %}语言{% endif %}">
<a href="{{ '/ruaoc/privacy-policy/' | relative_url }}" lang="zh-CN" hreflang="zh-CN"{% if page.lang != 'en' %} aria-current="page"{% endif %}>简体中文</a> · <a href="{{ '/ruaoc/en/privacy-policy/' | relative_url }}" lang="en" hreflang="en"{% if page.lang == 'en' %} aria-current="page"{% endif %}>English</a>
</nav>
<main>
{{ content }}
</main>
</body>
</html>
